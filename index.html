<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گذرنامه دیجیتال محصول – سفر یک محصول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF1DC;--peach:#FFE3BF;--brown:#6B4226;--brown2:#8a5a36;--orange:#F5A623;--orange2:#d98a0f;--green:#27AE60;--ink:#3b2f2f;--line:#ecd9bd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;background:var(--peach);color:var(--brown);overflow:hidden;font-size:15px;line-height:1.7}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,h4,p{margin:0}
.ic{flex:none;vertical-align:-3px}
.screen{position:fixed;inset:0;display:none;overflow:auto}
.screen.on{display:block;animation:fade .45s ease}
#s-main.on{display:flex;flex-direction:column;overflow:hidden}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 48px;text-align:center}
.wrap h1{font-size:clamp(26px,5vw,40px);font-weight:900;line-height:1.35;margin-top:10px;text-wrap:balance}
.sub{font-size:clamp(15px,2.4vw,18px);color:var(--brown2);margin:6px auto 26px;max-width:620px}
.demo{display:inline-block;background:#fff;border:1.5px dashed var(--brown2);border-radius:99px;padding:1px 10px;font-size:11.5px;color:var(--brown2);white-space:nowrap}
.demo.big{font-size:13px;padding:3px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.pcard{background:#fff;border:3px solid var(--brown);border-radius:24px;padding:18px 18px 22px;box-shadow:0 7px 0 var(--brown);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.pcard:hover{transform:translateY(-4px)}
.pcard h2{font-size:22px;font-weight:900}
.pcard p{font-size:14.5px;color:var(--brown2);flex:1}
.art{width:170px;height:128px;background:linear-gradient(#e9f7ff,#fff7e6);border-radius:18px;display:grid;place-items:center}
.art svg{width:82%;height:82%}
.art.sm{width:64px;height:48px;border-radius:12px}.art.xs{width:38px;height:30px;border-radius:9px;flex:none}.art.pp{width:92px;height:76px;flex:none;background:#3a3a3a}
.btn{background:var(--orange);color:#fff;font-weight:800;font-size:16px;padding:10px 26px;border-radius:14px;box-shadow:0 5px 0 var(--orange2);transition:transform .1s,box-shadow .1s;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange2)}
.btn.sm{font-size:13.5px;padding:7px 14px;border-radius:11px;box-shadow:0 3px 0 var(--orange2);margin-top:12px}
.btn.ghost{background:#fff;color:var(--brown);box-shadow:0 3px 0 var(--line);border:1.5px solid var(--line)}
.motto{margin:34px auto 0;max-width:680px;font-weight:700;color:var(--brown2);font-size:15px}
.rtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{font-size:13.5px;color:var(--brown2);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:6px 4px}
.mini{display:inline-flex;align-items:center;gap:10px}
div.mini{background:#fff;border-radius:16px;padding:6px 16px 6px 8px;margin-top:6px;border:2px solid var(--line)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;text-align:right}
.rcard{background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:right;box-shadow:0 4px 0 var(--line);transition:.15s}
.rcard b{font-size:16.5px;font-weight:900}.rcard span{font-size:13px;color:var(--brown2);line-height:1.65}
.rcard .ricon{width:44px;height:44px;border-radius:13px;background:var(--peach);display:grid;place-items:center;color:var(--brown)}
.rcard.sel{border-color:var(--orange);box-shadow:0 4px 0 var(--orange2);background:#fffaf0}.rcard.sel .ricon{background:var(--orange);color:#fff}
#roleextra h3{margin:26px 0 10px;font-size:18px}
.complist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.cbtn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;text-align:right;font-weight:800;font-size:14.5px;position:relative;padding-right:30px}
.cbtn i{position:absolute;right:11px;top:17px;width:10px;height:10px;border-radius:50%}
.cbtn small{display:block;font-weight:500;color:var(--brown2);font-size:12px}
.cbtn.sel{border-color:var(--orange);background:#fffaf0}
.confirm{margin-top:22px;background:#fff;border:2.5px dashed var(--orange);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.confirm p{font-size:17px}
.note{margin-top:22px;font-size:12.5px;color:var(--brown2);max-width:700px;margin-inline:auto}

/* ---- نوار بالا ---- */
#top{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--cream);border-bottom:2px solid var(--line);z-index:30;flex:none;min-height:54px}
.ibtn{width:38px;height:38px;border-radius:12px;background:#fff;border:2px solid var(--line);display:grid;place-items:center;flex:none}
#hprod{display:flex;align-items:center;gap:8px;min-width:0}
#hprod b{display:block;font-size:14.5px;line-height:1.3;white-space:nowrap}#hprod small{display:block;font-size:11.5px;color:var(--brown2);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.chipbtn{background:#fff;border:2px solid var(--orange);color:var(--orange2);font-weight:800;font-size:13px;border-radius:99px;padding:4px 13px;white-space:nowrap;flex:none}
.grow{flex:1}
.pillst{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 11px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pillst.ok{background:#e3f6ea;color:#1e8449}.pillst.bad{background:#fde8e4;color:#c0392b;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.55}}
#clock{font-size:12px;color:var(--brown2);white-space:nowrap}

/* ---- صحنه ---- */
#stage{position:relative;flex:1;overflow:hidden;background:#bfe4f5;min-height:0}
#stage>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;visibility:hidden;cursor:grab}
#stage>svg.on{visibility:visible}
#stage>svg:active{cursor:grabbing}
#game{background:linear-gradient(#8fd3f7,#c6ecff 70%)}
svg text{font-family:'Vazirmatn',Tahoma,sans-serif}
[data-act]{cursor:pointer}
.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:6;width:max-content;max-width:96%;pointer-events:none}
.hud>*{pointer-events:auto}
.seg2{background:#fff;border-radius:14px;padding:4px;display:flex;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.seg2 button{padding:6px 15px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--brown2)}
.seg2 button.on{background:var(--orange);color:#fff}
.flows{background:rgba(255,255,255,.93);border-radius:12px;padding:5px 11px;display:flex;gap:13px;font-size:12px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.flows span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.fl{display:inline-block;width:24px;height:0;border-top:4px solid #7a8591;border-radius:2px}
.fl.inf{border-top:4px dotted #1e88e5}
.dpp-off .fl.inf{border-top-color:#b0b7be}
#banner{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:6;width:min(640px,94%);pointer-events:none}
#banner div{background:#fff3e0;border:2px solid #f39c12;color:#8a4b00;border-radius:13px;padding:7px 13px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.14)}
#toasts{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);z-index:25;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:94%}
.toast{background:#2f2a26;color:#fff;border-radius:99px;padding:6px 15px;font-size:13px;display:flex;gap:7px;align-items:center;animation:tin .25s ease;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.toast .ic{color:#58d68d}.toast.warn .ic{color:#f5b041}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.zoom{position:absolute;left:10px;top:64px;z-index:5;display:flex;flex-direction:column;gap:5px}
.zoom button{width:36px;height:36px;border-radius:11px;background:#fff;font-size:19px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.16);line-height:1}
#legend{position:absolute;right:10px;top:64px;z-index:5;background:rgba(255,255,255,.95);border-radius:13px;box-shadow:0 2px 10px rgba(0,0,0,.14);font-size:12px;max-width:240px}
#legend summary{padding:7px 12px;font-weight:800;list-style:none;cursor:pointer;display:flex;gap:6px;align-items:center}
#legend summary::-webkit-details-marker{display:none}
#legend div{padding:0 12px 10px;display:flex;flex-direction:column;gap:2px}
#legend h4{font-size:11.5px;color:var(--brown2);margin-top:7px;border-top:1px solid var(--line);padding-top:6px}
#legend span{display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;flex:none}.ln{width:22px;height:4px;border-radius:2px;flex:none;background:#777}
.ln.rail{background:repeating-linear-gradient(90deg,#555 0 4px,#fff 4px 7px);height:5px}.ln.sea{background:repeating-linear-gradient(90deg,#1f6fb2 0 5px,transparent 5px 9px)}
#actions{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px;background:rgba(255,255,255,.96);padding:7px;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#actions::-webkit-scrollbar{display:none}
.abtn{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:12px;font-weight:800;font-size:13px;background:var(--peach);white-space:nowrap;flex:none;line-height:1.3;text-align:right}
.abtn small{display:block;font-weight:500;font-size:10.5px;opacity:.85}
.abtn.go{background:var(--green);color:#fff}.abtn.go.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(39,174,96,.25)}}
.abtn.pp{background:#2b2b2b;color:#fff}
.abtn.dpp{background:#fde8e4;color:#c0392b;border:2px solid #f1b4aa}
.abtn.dpp.off{background:#e3f6ea;color:#1e8449;border-color:#9fd9b5}

/* ---- عناصر نقشه ---- */
.land{fill:#dcefc0;stroke:#a5cd86;stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lake{fill:#bfe4f5;stroke:#a5cd86;stroke-width:1;vector-effect:non-scaling-stroke}
.ggrid path{stroke:#fff;stroke-width:1;opacity:.35;vector-effect:non-scaling-stroke;fill:none}
.ctry text{font-size:11px;fill:#7b8a63;font-weight:700;paint-order:stroke;stroke:#eef7df;stroke-width:3px}
.sealbl text{font-size:11px;fill:#5d9cc0;font-style:italic;font-weight:500}
#geo .ctry{display:none}#geo.z2 .ctry{display:block}
.rt{fill:none;stroke:var(--c);stroke-width:3.2;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.rt.rail{stroke-width:5}.ties{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:2 6;vector-effect:non-scaling-stroke}
.rt.sea{stroke-dasharray:7 6;stroke-width:2.6}
.hit{fill:none;stroke:transparent;stroke-width:18;vector-effect:non-scaling-stroke}
.edge{transition:opacity .25s}.edge.dim{opacity:.1}.edge.hl .rt{stroke-width:5.5}.edge.hl .rt.rail{stroke-width:7.5}
.seg.hls .rt{stroke-width:8;filter:drop-shadow(0 0 3px #fff)}
.dimv{opacity:.12}
.info{fill:none;stroke:#1e88e5;stroke-width:3.2;stroke-dasharray:.1 8;vector-effect:non-scaling-stroke;stroke-linecap:round;animation:flow 1s linear infinite;opacity:.85;pointer-events:none}
#game .info{stroke-width:4;stroke-dasharray:.1 10}
@keyframes flow{to{stroke-dashoffset:-40}}
.dpp-off .info{animation:none;stroke:#9aa3ab;opacity:.55}
.pillbg{fill:#2f2a26;opacity:.92}.pillbg.self{fill:#b9770e;stroke:#ffe08a;stroke-width:2}
.pilltx{fill:#fff;font-size:11px;font-weight:700}
#geo .comp .cl,#geo .hub .hl{display:none}
#geo .hub:hover .hl,#geo .comp:hover .cl{display:block!important}
.selfring{fill:none;stroke:#f5a623;stroke-width:3;stroke-dasharray:4 3;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.comp.sel>circle:not(.selfring){stroke:#f5a623;stroke-width:4}
.glabel.sel .pillbg{fill:#b9770e}
.rg{fill:rgba(46,158,91,.2);stroke:#2E9E5B;stroke-width:2;stroke-dasharray:5 4}
.warn{display:none}.dpp-off .warn{display:block;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.veh .vb{display:none}
.pingc{transform-box:fill-box;transform-origin:center;fill:none;stroke:#1e88e5;stroke-width:3;animation:ping 1.2s ease-out forwards}.pingc.bad{stroke:#e67e22;stroke-dasharray:3 3}
.pingk{animation:pk 1.2s ease-out forwards}
@keyframes ping{from{transform:scale(.6);opacity:1}to{transform:scale(4.4);opacity:0}}@keyframes pk{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
#game polyline{fill:none;stroke-linejoin:round;stroke-linecap:round}
.groad{stroke:#8d98a5;stroke-width:15}.groad2{stroke:var(--c);stroke-width:2.5;stroke-dasharray:7 8}
.grail{stroke:#a9835a;stroke-width:12}.grail2{stroke:#4a3a28;stroke-width:9;stroke-dasharray:2.5 7;stroke-linecap:butt!important}
.gsea{stroke:#5fbdf0;stroke-width:24}.gsea2{stroke:#fff;stroke-width:2;stroke-dasharray:6 12;opacity:.9}
#game .edge.hl .groad,#game .edge.hl .grail,#game .edge.hl .gsea{filter:drop-shadow(0 0 5px #fff)}
#game .seg.hls polyline:first-child{stroke:#f5a623}
.bld:hover{filter:brightness(1.06)}

/* ---- پنل ---- */
#panel{position:absolute;top:0;bottom:0;left:0;width:410px;max-width:100%;background:#fffaf2;z-index:40;transform:translateX(-106%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.22)}
#panel.on{transform:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);flex:none;cursor:default}
.ph b{font-size:16px;font-weight:900}
.xbtn{width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.07);font-size:14px;flex:none}
#pbody{overflow:auto;padding:14px 16px 28px;flex:1;-webkit-overflow-scrolling:touch}
#pbody h4{font-size:13.5px;margin:16px 0 6px;color:var(--brown2)}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid rgba(128,128,128,.22);font-size:13.5px}
.row span{color:var(--brown2);flex:none;max-width:45%}.row b{font-weight:700;text-align:left;word-break:break-word}
.st{font-style:normal;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 9px;display:inline-block;white-space:nowrap}
.st.ok{background:#e3f6ea;color:#1e8449}.st.rev{background:#fff3d6;color:#9a6700}.st.exp{background:#fde8e4;color:#c0392b}.st.na{background:#eceff1;color:#607d8b}.st.lock{background:#ede7f6;color:#5e35b1;margin-right:4px}
.fine{font-size:11.5px;opacity:.75;margin-top:10px;line-height:1.7}
.restricted{background:#ede7f6;color:#4527a0;border-radius:12px;padding:12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.restricted.sm{font-size:12px;padding:7px 10px;margin-top:10px;font-weight:500}
.almsg{background:#fff3e0;color:#8a4b00;border:1.5px solid #f5c26b;border-radius:12px;padding:11px;font-weight:700;font-size:14px;margin-bottom:8px}
.almsg.ok{background:#e9f7ee;color:#1e6b3c;border-color:#a9dcbc}
.evl{display:flex;flex-direction:column;gap:5px}
.ev{background:rgba(128,128,128,.1);border-radius:10px;padding:6px 10px;font-size:12.5px;display:grid;grid-template-columns:1fr auto;gap:0 8px}
.ev small{grid-column:1/-1;opacity:.7;font-size:11px;direction:rtl}
.thint{font-size:12.5px;opacity:.7}
.erow{display:flex;align-items:center;gap:9px;width:100%;text-align:right;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:7px 10px;margin-bottom:6px;font-weight:700;font-size:13.5px}
.erow i{width:6px;height:28px;border-radius:3px;flex:none}.erow span{flex:1}.erow small{display:block;font-weight:500;font-size:11.5px;color:var(--brown2)}.erow .ic{transform:rotate(90deg)}
.dotl{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.legs{display:flex;flex-direction:column;gap:6px}.leg{display:flex;gap:10px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:7px 10px}
.leg b{display:block;font-size:13.5px}.leg small{font-size:11.5px;color:var(--brown2)}
.sbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* شناسنامه تیره */
#panel.dark{background:#2b2b2b;color:#f2f2f2}
#panel.dark .ph{border-color:#444}#panel.dark .xbtn{background:#444;color:#fff}
.dark .row span,.dark #pbody h4{color:#b9b9b9}.dark .row{border-color:#444}
.phead{display:flex;gap:14px;align-items:center;padding-bottom:10px}
.phead h2{font-size:20px;font-weight:900;line-height:1.4}.phead small{color:#b9b9b9;font-size:12.5px}
.verif{color:#2ecc71;font-weight:700;font-size:14px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.verif em{font-style:normal;font-weight:500;font-size:11.5px;opacity:.85}
.offnote{background:#4a2d1c;color:#ffcf99;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:10px}
.acc{border-top:1px solid #444}.acc:last-of-type{border-bottom:1px solid #444}
.acc summary{display:flex;align-items:center;gap:10px;padding:15px 2px;font-size:16.5px;font-weight:800;cursor:pointer;list-style:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{flex:1}.acc summary .ic:last-child{transition:transform .2s;color:#b9b9b9}.acc[open] summary .ic:last-child{transform:rotate(180deg)}
.accb{padding:0 2px 16px}
.tnote{font-size:12px;background:#383838;border-radius:10px;padding:8px 10px;color:#d6d6d6;line-height:1.75}
.tlabel{font-size:12.5px;color:#b9b9b9;margin:12px 0 7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid #555;border-radius:99px;padding:4px 12px 4px 10px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;color:#eee}
.chip i{width:18px;height:6px;border-radius:3px;background:var(--c)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}.chip.on i{background:#fff}
.steps{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.stepw{background:#363636;border-radius:13px;border:1.5px solid transparent;overflow:hidden}
.stepw.sel{border-color:var(--c);background:#3d3d3d}
.step{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;text-align:right;color:#f2f2f2}
.num{width:27px;height:27px;border-radius:50%;background:var(--c);color:#fff;font-weight:900;font-size:13.5px;display:grid;place-items:center;flex:none}
.sic{color:var(--c);display:grid;place-items:center;flex:none}
.stt{flex:1;min-width:0}.stt b{display:block;font-size:13.5px;line-height:1.5}.stt small{display:block;font-size:11.5px;color:#b9b9b9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sdate{font-size:11.5px;color:#cfcfcf;flex:none;background:#2b2b2b;border-radius:8px;padding:1px 7px}
.stepd{padding:2px 12px 12px;border-top:1px dashed #555}.stepd .row{font-size:12.5px;padding:6px 0}
button.mini{background:#4a4a4a;color:#fff;border-radius:9px;padding:5px 11px;font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
button.mini.wide{width:100%;justify-content:center;margin-top:14px;padding:9px;background:#1e6b3c}
.legendbox{background:#363636;border-radius:13px;padding:10px 12px;margin-top:14px}
.legendbox b{display:flex;gap:7px;align-items:center;font-size:13px;margin-bottom:6px}

.gap{font-size:12.5px;background:#4a2d1c;color:#ffcf99;border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.9}

.tree li{font-size:12.5px;padding:3px 0}.tree small{color:#b9b9b9}
.bid{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#444;border-radius:6px;padding:1px 6px;direction:ltr;display:inline-block}
.lbad{color:#ffb38a}
.bar{display:grid;grid-template-columns:130px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}

.bar b{text-align:left}

.cert.review{border-color:#f1c40f}.cert.expired{border-color:#e74c3c;opacity:.85}
.cert>b{font-size:13.5px;display:block;margin-bottom:2px}.cert .row{font-size:12.5px;padding:5px 0}
.care{margin:0;padding-right:18px;font-size:13.5px}.care li{padding:3px 0}

.use{color:#7ee2a8;font-size:12.5px;margin-top:6px}

#net{position:absolute;left:0;right:0;bottom:0;background:#fffaf2;z-index:35;transform:translateY(106%);transition:transform .3s ease;box-shadow:0 -6px 24px rgba(0,0,0,.2);border-radius:18px 18px 0 0;max-height:62%;display:flex;flex-direction:column}
#net.on{transform:none}
#net header{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);flex:none}
#net header small{flex:1;font-size:12px;color:var(--brown2)}
#netbody{overflow:auto;padding:8px 10px 12px}
.netc{position:relative;margin:0 auto}
.ncol{position:absolute;top:0;text-align:center;direction:rtl}.ncol:nth-child(odd){background:rgba(245,166,35,.07)}
.ncol b{font-size:12px;color:var(--brown2);display:block;padding-top:6px}
.netc svg{position:absolute;inset:0}
.nline{fill:none;stroke-width:2.2;opacity:.85}.nhit{fill:none;stroke:transparent;stroke-width:14}
.nl:hover .nline{stroke-width:4.5;opacity:1}
.ncard{position:absolute;direction:rtl;background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:11.5px;font-weight:700;line-height:1.35;text-align:right;padding:2px 14px 2px 6px;display:flex;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.ncard i{position:absolute;right:0;top:0;bottom:0;width:7px;background:var(--c);border-radius:0 8px 8px 0}
.ncard.self{border-color:var(--orange);background:#fff6e0;box-shadow:0 0 0 3px rgba(245,166,35,.3)}
.ncard:hover{border-color:var(--brown2)}

.modal{position:absolute;inset:0;background:rgba(40,25,10,.5);z-index:60;display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.mbox{background:#fff;border-radius:22px;border:3px solid var(--brown);box-shadow:0 7px 0 var(--brown);padding:20px 22px;max-width:380px;text-align:center}
.mbox h3{font-size:20px;font-weight:900}.mbox ol{text-align:right;font-weight:700;font-size:15.5px;padding-right:22px;margin:10px 0}
.mbox p{font-size:13px;color:var(--brown2);margin-bottom:14px}

  #stage.popen #actions,#stage.popen .hud,#stage.popen #banner,#stage.popen #toasts{left:calc(50% + 205px)}

  #stage.popen .zoom{left:420px}#stage.popen #net{left:410px}
}

}

  const occ=new Set(), mark=(x,y,r)=>{ for(let a=Math.floor(x-r);a<=Math.ceil(x+r);a++) for(let b=Math.floor(y-r);b<=Math.ceil(y+r);b++) occ.add(a+','+b); };
  nodes.forEach(n=>mark(n.g[0],n.g[1],2));
  const allE = sc.generic? P.GE.map((e,i)=>[[4+i*7,P.mid],[11+i*7,P.mid]]) : edges.map(e=>e.gpath); // فقط مسیرهای مجاز، تا جای خالی درخت‌ها مسیر پنهانی را لو ندهد
  allE.forEach(gp=>{ for(let i=1;i<gp.length;i++){ const a=gp[i-1],b=gp[i],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])); for(let k=0;k<=n;k++) mark(a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n,.6); } });
  const R=rng(P.code.length*977+W*H);
  for(let i=0;i<5;i++){ const x=2+R()*(W-6), y=2+R()*(H-6); if([...Array(9)].some((_,k)=>occ.has(Math.round(x+(k%3)-1)+','+Math.round(y+Math.floor(k/3)-1)))) continue; mark(x,y,1.5); const p=iso(x,y);
    h+=`<ellipse cx="${p[0]}" cy="${p[1]}" rx="52" ry="24" fill="#7ecbf1" stroke="#b6e3f8" stroke-width="4"/><ellipse cx="${p[0]-10}" cy="${p[1]-4}" rx="10" ry="4" fill="#fff" opacity=".6"/>`; }
  /* مسیرها */

  edges.forEach(e=>{ const c=e.color||P.B[e.branch].color;
    paths+=`<g class="edge" data-e="${e.id}" style="--c:${c}">`+e.fr.map((f,i)=>{ const pts=ptsStr(lineSub(e.gl,f[0],f[1])), m=e.segs[i].mode;

    if(e.branch){ const a=iso(...P.C[e.from].g), b=iso(...P.C[e.to].g); info+=`<path class="info" data-e="${e.id}" d="M${a[0]} ${a[1]-30}Q${(a[0]+b[0])/2} ${Math.min(a[1],b[1])-110} ${b[0]} ${b[1]-30}"/>`;
      e.fr.forEach((f,i)=>{ if(i===e.fr.length-1) return; const p=lineAt(e.gl,f[1]), port=e.segs[i].mode==='sea'||e.segs[i+1].mode==='sea';
        hubs+=`<g transform="translate(${p[0]} ${p[1]})"><title>${e.segs[i].hub}</title>${port?`<path d="M-12 2h24l-4 7h-16z" fill="#1f6fb2"/><rect x="-7" y="-10" width="14" height="12" rx="2" fill="#fff" stroke="#1f6fb2" stroke-width="2"/><text y="0" text-anchor="middle" font-size="9" fill="#1f6fb2">⚓</text>`:`<rect x="-11" y="-12" width="22" height="14" rx="2" fill="#fff7e8" stroke="#7a5230" stroke-width="2"/><path d="M-13-12L0-20L13-12z" fill="#7a5230"/>`}</g>`; }); }
    else info+=`<path class="info" d="M${e.gl.pts[0][0]} ${e.gl.pts[0][1]-30}Q${(e.gl.pts[0][0]+e.gl.pts[1][0])/2} ${e.gl.pts[0][1]-95} ${e.gl.pts[1][0]} ${e.gl.pts[1][1]-30}"/>`;
    vehs+=`<g data-v="${e.id}">${vehHTML(e.id,e.branch?'veh':'gveh')}</g>`; });
  h+=`<g id="game-routes">${paths}</g>${hubs}`;
  /* درخت‌ها، کوه‌ها و ساختمان‌ها به ترتیب عمق */
  const items=[];
  for(let x=-2.4;x<W;x+=2.3){ const s=.7+R()*.7, p=iso(x,-2.4-R()*.4); items.push([x-2.4,`<path d="M${p[0]-34*s} ${p[1]+8}L${p[0]} ${p[1]-62*s}L${p[0]+34*s} ${p[1]+8}Z" fill="#a8adb5"/><path d="M${p[0]} ${p[1]-62*s}L${p[0]+34*s} ${p[1]+8}L${p[0]+6*s} ${p[1]+8}Z" fill="#8f949c"/><path d="M${p[0]-11*s} ${p[1]-42*s}L${p[0]} ${p[1]-62*s}L${p[0]+11*s} ${p[1]-42*s}L${p[0]+4*s} ${p[1]-47*s}L${p[0]-3*s} ${p[1]-41*s}Z" fill="#fff"/>`]); }
  for(let y=0;y<H;y+=2.6){ const s=.6+R()*.6, p=iso(-2.4-R()*.4,y); items.push([y-2.4,`<path d="M${p[0]-34*s} ${p[1]+8}L${p[0]} ${p[1]-62*s}L${p[0]+34*s} ${p[1]+8}Z" fill="#a8adb5"/><path d="M${p[0]} ${p[1]-62*s}L${p[0]+34*s} ${p[1]+8}L${p[0]+6*s} ${p[1]+8}Z" fill="#8f949c"/><path d="M${p[0]-11*s} ${p[1]-42*s}L${p[0]} ${p[1]-62*s}L${p[0]+11*s} ${p[1]-42*s}L${p[0]+4*s} ${p[1]-47*s}L${p[0]-3*s} ${p[1]-41*s}Z" fill="#fff"/>`]); }
  const nT=Math.round(W*H*.11); for(let i=0;i<nT;i++){ const x=-2+R()*(W+1), y=-1.5+R()*(H+.5); if(occ.has(Math.round(x)+','+Math.round(y))) continue; items.push([x+y,tree(x,y,R())]); }
  nodes.forEach(n=>items.push([n.g[0]+n.g[1],building(n)]));
  items.sort((a,b)=>a[0]-b[0]); h+=items.map(i=>i[1]).join('');
  h+=`<g id="game-info">${info}</g><g id="game-veh">${vehs}</g>`;
  h+=nodes.map(n=>{ const p=iso(...n.g), self=n.id===sc.self, top=p[1]-(BH[n.kind]||60)-16;

  $('#game').innerHTML=`<g id="game-root">${h}<g id="game-ping"></g></g>`;
  gamePZ=PanZoom2($('#game'),$('#game-root'));

}

function renderNet(){ const P=S.P, sc=scope(); const cols=['سطح ۳: مواد اولیه','سطح ۲: فرآوری مواد','سطح ۱: تولید قطعات','تولیدکننده نهایی','توزیع و فروش'];
  const CW=196, CWd=164, RH=56, CH=42, W=5*CW; const byCol=[[],[],[],[],[]];
  const nodes = sc.generic? P.GN.map((n,i)=>({...n,col:i})) : P.companies.filter(c=>sc.comps.has(c.id));
  nodes.forEach(n=>byCol[n.col].push(n)); const maxR=Math.max(1,...byCol.map(c=>c.length)); const H=36+maxR*RH+8; const pos={};
  byCol.forEach((col,ci)=>col.forEach((n,i)=>{ pos[n.id]=[W-(ci+1)*CW+(CW-CWd)/2, 36+(maxR-col.length)*RH/2+i*RH]; }));
  const edges = sc.generic? P.GE : P.edges.filter(e=>sc.edges.has(e.id));
  const lines=edges.map(e=>{ const a=pos[e.from], b=pos[e.to]; let d;
    if(Math.abs(a[0]-b[0])<1) d=`M${a[0]+CWd/2} ${a[1]+CH}L${b[0]+CWd/2} ${b[1]}`; else d=`M${a[0]} ${a[1]+CH/2}C${a[0]-22} ${a[1]+CH/2} ${b[0]+CWd+22} ${b[1]+CH/2} ${b[0]+CWd} ${b[1]+CH/2}`;
    const c=e.color||P.B[e.branch].color; return `<g ${e.branch?`data-act="edge" data-id="${e.id}"`:''} class="nl"><path d="${d}" class="nhit"/><path d="${d}" stroke="${c}" class="nline"/></g>`; }).join('');
  $('#netbody').innerHTML=`<div class="netc" style="width:${W}px;height:${H}px">${cols.map((c,i)=>`<div class="ncol" style="left:${W-(i+1)*CW}px;width:${CW}px;height:${H}px"><b>${c}</b></div>`).join('')}<svg width="${W}" height="${H}">${lines}</svg>${nodes.map(n=>`<button class="ncard ${n.id===sc.self?'self':''}" data-act="${n.generic?'gnode':'comp'}" data-id="${n.id}" style="left:${pos[n.id][0]}px;top:${pos[n.id][1]}px;width:${CWd}px;height:${CH}px;--c:${TIER_COLOR[n.tier]}"><i></i><span>${n.name}${n.id===sc.self&&S.ctx.comp?' (شما)':''}</span></button>`).join('')}</div>`;
  $('#netnote').textContent = sc.generic? 'نمای خلاصه عمومی – شبکه شرکت‌ها برای مصرف‌کننده محرمانه است' : S.ctx.role==='manufacturer'? 'شبکه‌ای که در این سناریو با تولیدکننده نهایی به اشتراک گذاشته شده است' : 'فقط کارخانه شما و طرف‌های مستقیم آن';
  const sb=$('#netbody'); sb.scrollLeft=sb.scrollWidth; }

function selectStep(b,n,noFocus){ const P=S.P; S.branch=b; S.step={b,n}; const s=P.steps[b].find(x=>x.n===n); S.selComp=null;
  if(isConsumer()){ S.selEdge=null; applyHL(); if(!noFocus) focusRegion(s.country); }
  else if(s.kind==='move'){ noFocus? (S.selEdge=s.edge,S.selSeg=s.seg,applyHL()) : focusEdge(s.edge,s.seg); }
  else { S.selEdge=null; noFocus? (S.selComp=s.comp,applyHL()) : focusComp(s.comp); } }

 branch(d){ S.branch = S.branch===d.id? null : d.id; S.step=null; S.selEdge=null; S.selComp=null; applyHL(); $('#trk').innerHTML=trackHTML(); if(S.branch&&!isConsumer()&&!isMobile()) focusBranch(S.branch); },
 step(d){ const n=+d.n; if(S.step&&S.step.b===d.b&&S.step.n===n){ S.step=null; S.selEdge=null; S.selComp=null; applyHL(); } else selectStep(d.b,n,isMobile()); $('#trk').innerHTML=trackHTML(); },
 'show-map'(){ if(S.view==='game'&&isConsumer()) setView('geo'); if(isMobile()){ $('#panel').classList.add('peek'); $('#stage').classList.add('peeking'); } const s=S.step&&S.P.steps[S.step.b].find(x=>x.n===S.step.n); if(s) setTimeout(()=>selectStep(S.step.b,S.step.n),isMobile()?320:0); },
 'ship-track'(d){ const e=S.P.E[d.id], s=SIM.ships[e.id]; const st=S.P.steps[e.branch].find(x=>x.kind==='move'&&x.edge===e.id&&x.seg===s.seg); S.shipFilter=s.id; selectStep(e.branch,st.n,true); openTrack(); },
 'focus-comp'(d){ if(isMobile()) closePanel(); $('#net').classList.remove('on'); setTimeout(()=>focusComp(d.id),isMobile()?320:0); },
 'focus-edge'(d){ if(isMobile()) closePanel(); $('#net').classList.remove('on'); setTimeout(()=>focusEdge(d.id,null),isMobile()?320:0); },
 eol(d){ S.eol=+d.id; $('#eolb').innerHTML=eolHTML(); },
 'goto-eol'(){ S.open.eol=true; const el=$('#pbody [data-sec="eol"]'); el.open=true; el.scrollIntoView({behavior:'smooth'}); },
 zin(){ (S.view==='geo'?geoPZ:gamePZ).zoomBy(1.5); }, zout(){ (S.view==='geo'?geoPZ:gamePZ).zoomBy(1/1.5); }, zfit(){ S.view==='geo'?fitGeo():fitGame(); },
 'guide-close'(){ $('#guide').classList.remove('on'); }
};
document.addEventListener('click',ev=>{ const t=ev.target.closest('[data-act]'); if(!t) return;
  const svg=ev.target.closest('svg#geo,svg#game'); if(svg){ const pz=svg.id==='geo'?geoPZ:gamePZ; if(pz&&pz.moved) return; }
  const f=ACT[t.dataset.act]; if(f){ f(t.dataset,ev); } });
document.addEventListener('toggle',ev=>{ const d=ev.target; if(d.dataset&&d.dataset.sec) S.open[d.dataset.sec]=d.open; },true);

/* ---------- اتصال موتور شبیه‌سازی به رابط ---------- */
let lastToast=0;
HOOK.event=(ev,e)=>{ if(S.ctx.role&&!isConsumer()&&canEdge(e.id)) ping(e.id); };
HOOK.missed=(c,e)=>{ if(S.ctx.role&&!isConsumer()&&canEdge(e.id)) ping(e.id,'bad'); };
HOOK.arrive=(s,e)=>{ if(!S.ctx.role) return; const vis=isConsumer()? S.P.C[e.to].kind==='store' : canEdge(e.id); if(!vis) return; const now=performance.now(); if(now-lastToast<2800) return; lastToast=now;
  SIM.dpp? toast('اطلاعات محموله به‌روزرسانی شد.') : toast(isConsumer()?'اطلاعات جدیدی برای شناسنامه دریافت نشد.':'محموله رسید، اما رویداد تحویل ثبت نشد.','warn'); };

/* ---------- حلقه اصلی ---------- */
let _lt=performance.now(), _sec=0;
function loop(now){ const dt=Math.min(.1,(now-_lt)/1000); _lt=now;
  if(S.P&&S.ctx.role){ simTick(dt); if($('#s-main').classList.contains('on')){ drawVehicles(); _sec+=dt;
      if(_sec>1){ _sec=0; $('#clock').textContent='زمان شبیه‌سازی: '+jtime(SIM.t);
        const p=S.panel; if(p){ if(p.type==='passport'){ const l=$('#lastupd'); if(l) l.textContent=lastUpd(); const lv=$('#live'); if(lv&&S.open.track) lv.innerHTML=liveHTML(); }
          else if(p.type==='ship'&&SIM.running) renderPanel(true); else if(p.type==='alert'){ const g=$('#algap'); if(g&&SIM.gapOpen) g.textContent=fa(nodeGap(SIM.gapOpen,p.id)); } } } } }
  requestAnimationFrame(loop); }
window.addEventListener('DOMContentLoaded',()=>{ initGeoBase(); renderProducts(); showScreen('s-product'); requestAnimationFrame(loop); });

</script>
</body>
